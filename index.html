<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Bingo Master</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #121824; color: #fff; padding: 15px; }

    /* Top Bar */
    .header-bar { display: flex; justify-content: space-between; align-items: center; background: #1b2438; padding: 10px 20px; border-radius: 8px; margin-bottom: 15px; }
    .game-title { font-size: 24px; font-weight: bold; color: #f39c12; letter-spacing: 1px; }
    .badge { background: #e74c3c; padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
    .info-box { background: #2c3e50; padding: 6px 12px; border-radius: 5px; font-size: 14px; }
    .info-box span { color: #2ecc71; font-weight: bold; }

    /* Main Layout */
    .main-container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }

    /* Left: Board */
    .board-section { flex: 2; min-width: 320px; max-width: 650px; }
    .bingo-grid { display: grid; grid-template-columns: 40px repeat(15, 1fr); gap: 4px; background: #1b2438; padding: 12px; border-radius: 8px; }
    .letter-header { background: #f39c12; color: #000; font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
    .grid-cell { background: #2c3e50; color: #ecf0f1; height: 35px; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 4px; font-size: 13px; }
    .grid-cell.active { background: #e74c3c; color: #fff; box-shadow: 0 0 8px #e74c3c; }

    /* Right: Display & Controls */
    .control-section { flex: 1; min-width: 280px; max-width: 350px; display: flex; flex-direction: column; gap: 15px; }
    
    /* Caller Display */
    .caller-card { background: #1b2438; padding: 20px; border-radius: 12px; text-align: center; border: 2px solid #2c3e50; }
    .big-number { font-size: 70px; font-weight: 900; color: #f1c40f; line-height: 1; margin: 10px 0; }
    .letter-prefix { font-size: 24px; color: #e67e22; font-weight: bold; }

    /* Control Buttons */
    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn { padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .btn-primary { background: #f39c12; color: #000; }
    .btn-success { background: #27ae60; color: #fff; }
    .btn-danger { background: #c0392b; color: #fff; }
    .btn-secondary { background: #34495e; color: #fff; }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }

    /* Check Card Box */
    .check-box { background: #1b2438; padding: 15px; border-radius: 8px; }
    .check-box input { width: 65%; padding: 8px; border-radius: 4px; border: 1px solid #34495e; background: #121824; color: #fff; }
    .check-box button { width: 30%; }

    /* Win Banner */
    .win-banner { background: #27ae60; padding: 15px; border-radius: 8px; text-align: center; }
    .win-banner h3 { margin-bottom: 5px; font-size: 16px; }
    .win-banner h2 { font-size: 26px; color: #f1c40f; }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="header-bar">
    <div>
      <span class="game-title">CLASSIC BINGO</span>
      <span class="badge">Game Started</span>
    </div>
    <div class="info-box">BET: <span>30 BIRR</span></div>
    <div class="info-box">WIN: <span>21 BIRR</span></div>
    <div class="info-box">CALLED: <span id="calledCount">0/75</span></div>
  </div>

  <div class="main-container">
    <!-- Left: 1-75 Grid -->
    <div class="board-section">
      <div class="bingo-grid" id="bingoGrid"></div>
    </div>

    <!-- Right: Caller & Actions -->
    <div class="control-section">
      <!-- Big Caller -->
      <div class="caller-card">
        <div class="letter-prefix" id="letterPrefix">READY</div>
        <div class="big-number" id="displayNumber">00</div>
      </div>

      <!-- Action Buttons -->
      <div class="controls-grid">
        <button class="btn btn-primary" id="autoBtn" onclick="toggleAutoCall()">Auto Call Off</button>
        <button class="btn btn-success" onclick="drawNextNumber()">Next</button>
        <button class="btn btn-secondary" onclick="resetGame()">Shuffle / New</button>
        <button class="btn btn-danger" onclick="stopAutoCall()">Finish</button>
      </div>

      <!-- Check Cartela -->
      <div class="check-box">
        <input type="number" id="cartelaId" placeholder="Cartela ID (e.g. 12)">
        <button class="btn btn-primary" onclick="checkCartela()">Check</button>
      </div>

      <!-- Win Prize Display -->
      <div class="win-banner">
        <h3>Win Money</h3>
        <h2>21 BIRR</h2>
      </div>
    </div>
  </div>

  <script>
    let drawnNumbers = [];
    let autoInterval = null;

    // ቁጥሮችን ወደ አማርኛ ቃላት መቀየሪያ
    function numberToAmharic(num) {
      const units = ["", "አንድ", "ሁለት", "ሦስት", "አራት", "አምስት", "ስድስት", "ሰባት", "ስምንት", "ዘጠኝ"];
      const tens = ["", "አሥር", "ሀያ", "ሠላሳ", "አርባ", "ሃምሳ", "ስድሳ", "ሰባ", "ሰማንያ", "ዘጠና"];
      if (num === 0) return "ዜሮ";
      if (num < 10) return units[num];
      if (num === 10) return "አሥር";
      if (num < 20) return "አሥራ " + units[num % 10];
      let t = Math.floor(num / 10);
      let u = num % 10;
      return tens[t] + (u > 0 ? " " + units[u] : "");
    }

    function speakAmharic(num) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const text = numberToAmharic(num);
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'am-ET';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Build B-I-N-G-O Grid
    function createBoard() {
      const grid = document.getElementById('bingoGrid');
      grid.innerHTML = '';
      const letters = ['B', 'I', 'N', 'G', 'O'];
      
      for (let r = 0; r < 5; r++) {
        // Letter header
        const header = document.createElement('div');
        header.className = 'letter-header';
        header.innerText = letters[r];
        grid.appendChild(header);

        // 15 numbers per row
        const startNum = r * 15 + 1;
        for (let c = 0; c < 15; c++) {
          const num = startNum + c;
          const cell = document.createElement('div');
          cell.className = 'grid-cell';
          cell.id = 'num-' + num;
          cell.innerText = num;
          grid.appendChild(cell);
        }
      }
    }

    function getLetter(num) {
      if (num <= 15) return 'B';
      if (num <= 30) return 'I';
      if (num <= 45) return 'N';
      if (num <= 60) return 'G';
      return 'O';
    }

    function drawNextNumber() {
      if (drawnNumbers.length >= 75) {
        stopAutoCall();
        alert("ሁሉም 75 ቁጥሮች ተጠርተዋል!");
        return;
      }

      let rand;
      do {
        rand = Math.floor(Math.random() * 75) + 1;
      } while (drawnNumbers.includes(rand));

      drawnNumbers.push(rand);

      // UI Update
      const letter = getLetter(rand);
      document.getElementById('letterPrefix').innerText = letter;
      document.getElementById('displayNumber').innerText = rand;
      document.getElementById('calledCount').innerText = drawnNumbers.length + '/75';

      // Highlight Grid Cell
      const cell = document.getElementById('num-' + rand);
      if (cell) cell.classList.add('active');

      // Voice
      speakAmharic(rand);
    }

    function toggleAutoCall() {
      const btn = document.getElementById('autoBtn');
      if (autoInterval) {
        stopAutoCall();
      } else {
        autoInterval = setInterval(drawNextNumber, 4000);
        btn.innerText = 'Auto Call On';
        btn.style.background = '#27ae60';
        drawNextNumber();
      }
    }

    function stopAutoCall() {
      if (autoInterval) {
        clearInterval(autoInterval);
        autoInterval = null;
      }
      const btn = document.getElementById('autoBtn');
      btn.innerText = 'Auto Call Off';
      btn.style.background = '#f39c12';
    }

    function resetGame() {
      stopAutoCall();
      drawnNumbers = [];
      document.getElementById('letterPrefix').innerText = 'READY';
      document.getElementById('displayNumber').innerText = '00';
      document.getElementById('calledCount').innerText = '0/75';
      createBoard();
    }

    function checkCartela() {
      const id = document.getElementById('cartelaId').value;
      if (!id) {
        alert("እባክዎን የካርቴላ ቁጥር ያስገቡ!");
        return;
      }
      alert("ካርቴላ #" + id + " ተፈትሿል!");
    }

    // Init
    createBoard();
  </script>
</body>
</html>
