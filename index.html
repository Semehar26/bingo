


<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ፕሮፌሽናል የቢንጎ ጨዋታ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #111; color: #fff; padding: 15px; margin: 0; }
    h1 { color: #f39c12; }
    .wallet-box { background: #222; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #444; }
    .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 320px; margin: 15px auto; }
    .cell { background: #333; border: 1px solid #f39c12; border-radius: 5px; padding: 12px 0; font-size: 18px; font-weight: bold; cursor: pointer; }
    .cell.selected { background: #27ae60; color: #fff; }
    .btn { padding: 10px 15px; font-size: 14px; background: #e67e22; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; }
    .btn-buy { background: #2980b9; }
  </style>
</head>
<body>

  <h1>🎲 ፕሮፌሽናል የቢንጎ ጨዋታ 🎲</h1>

  <div class="wallet-box">
    <div>የሂሳብ መጠን (Wallet)፦ <strong id="balance" style="color:#2ecc71;">100</strong> ብር</div>
    <div>የተሰበሰበ ጠቅላላ ብር (Pool)፦ <strong id="totalPool" style="color:#f1c40f;">0</strong> ብር</div>
  </div>

  <div>
    <div>የተጠራ ቁጥር፦ <strong id="calledNum" style="font-size: 28px; color: #e74c3c;">-</strong></div>
  </div>

  <div class="board" id="board"></div>

  <div>
    <button class="btn btn-buy" onclick="buyCard()">ካርድ ግዛ (10 ብር)</button>
    <button class="btn" onclick="drawNumberWithVoice()">ቁጥር በድምፅ ጥራ</button>
  </div>

  <script>
    const SUPABASE_URL = "https://byorbdmwyunjfqkkygct.supabase.co";
    const SUPABASE_KEY = "sb_publishable_BA3vdxXDmCQPsp..."; // ሙሉውን ቁልፍ እዚህ ይተኩ
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let balance = 100;
    let totalPool = 0;
    const cardPrice = 10;
    let drawnNumbers = [];

    function speakNumber(num) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance("Number " + num);
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function buyCard() {
      if (balance < cardPrice) {
        alert("በቂ ብር የሎትም!");
        return;
      }
      balance -= cardPrice;
      totalPool += cardPrice;
      document.getElementById('balance').innerText = balance;
      document.getElementById('totalPool').innerText = totalPool;
      generateBoard();
    }

    function generateBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      let numbers = Array.from({length: 75}, (_, i) => i + 1).sort(() => 0.5 - Math.random()).slice(0, 25);
      
      numbers.forEach((num, index) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (index === 12) {
          cell.innerText = 'FREE';
          cell.classList.add('selected');
        } else {
          cell.innerText = num;
          cell.onclick = () => cell.classList.toggle('selected');
        }
        board.appendChild(cell);
      });
    }

    function drawNumberWithVoice() {
      if (drawnNumbers.length >= 75) {
        alert("ሁሉም ቁጥሮች ተጠርተዋል!");
        return;
      }
      let rand;
      do {
        rand = Math.floor(Math.random() * 75) + 1;
      } while (drawnNumbers.includes(rand));
      
      drawnNumbers.push(rand);
      document.getElementById('calledNum').innerText = rand;
      speakNumber(rand);
    }

    generateBoard();
  </script>
</body>
</html>
